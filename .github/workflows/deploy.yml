name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Keeps the phone build current before the branch is merged. Drop this
      # line once the work lands on main.
      - claude/venture-interview-calculator-blo7fy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # No configure-pages step: its only job is to hand back a base_url, and
      # the base path is pinned in vite.config.js instead. Leaving it out also
      # keeps the build off the Pages management API, which the workflow token
      # is not allowed to read here.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
